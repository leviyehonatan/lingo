name: Deploy Lingo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      # As of 2026-08-30 this workflow also ships the compose file and writes
      # the .env, so changes to EITHER must trigger it. Without these two lines
      # a compose change pushes cleanly, fires nothing, and leaves the box on
      # the old file — which is exactly what happened the first time.
      - 'deploy/**'
      - '.github/workflows/deploy-lingo.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The compose file and the .env live in THIS repo's control as of
      # 2026-08-30 (they were in leviyehonatan/tun-ity-com). Both must reach the
      # box BEFORE the restart below, or that restart recreates the container
      # from the OLD file and reports success — a convincing no-op. Traefik in
      # particular reads routing from labels on the RUNNING container.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ship the compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /srv/apps/lingo/
          strip_components: 1

      # THIS REPO IS PUBLIC, so none of these values may ever appear in the
      # tree. They are forwarded via envs: rather than interpolated into
      # script: — interpolation would put them in the rendered command line and
      # therefore in the server's process list.
      - name: Write .env from secrets
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,NEXTAUTH_SECRET,NEXTAUTH_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB
          script: |
            set -e
            umask 077
            cat > /srv/apps/lingo/.env <<EOF
            DATABASE_URL=${DATABASE_URL}
            NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
            NEXTAUTH_URL=${NEXTAUTH_URL}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            EOF
            chmod 600 /srv/apps/lingo/.env
            # A quoted heredoc delimiter silently disables expansion, producing a
            # perfectly well-formed .env full of literal ${VAR} strings that
            # authenticates nothing — and a deploy that reports success. Assert.
            if grep -q '[$][{]' /srv/apps/lingo/.env; then
              echo "::error::/srv/apps/lingo/.env has unexpanded dollar-brace placeholders — the heredoc delimiter is quoted, so values were never substituted"
              exit 1
            fi
            n=$(grep -cE '^[A-Z0-9_]+=' /srv/apps/lingo/.env)
            [ "$n" -ge 8 ] || { echo "::error::/srv/apps/lingo/.env has $n keys, expected >= 8"; exit 1; }
            echo "wrote /srv/apps/lingo/.env ($n keys, no unexpanded vars)"

      - name: Build & restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/apps/lingo/src
            git pull --ff-only
            cd /srv/apps/lingo
            docker compose build app
            docker compose up -d --wait app
            docker image prune -f

      - name: Smoke check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://lingo.tun-ity.com/api/auth/providers) || code=000
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::Smoke check failed — site did not return 200"
          exit 1
