name: CI

on:
  pull_request:
  # No `push: main` trigger: the deploy workflow calls this one on every push
  # to main, so a second copy here only ran everything twice.
  workflow_call:

# A new push to the same PR makes the run for the old one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # src/generated/prisma is gitignored; every `@/generated/prisma` import
      # fails to resolve without it. `prisma generate` needs no DATABASE_URL.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # `npm run typecheck` runs `next typegen` first: it writes the global
      # route helpers (LayoutProps, PageProps, RouteContext) that tsc needs and
      # that are otherwise only produced by `next dev` / `next build`.
      - name: Typecheck
        run: npm run typecheck

  # Vitest: pure logic, data invariants and route handlers with Prisma mocked.
  # No database. Its own job so a unit failure reads distinctly from a lint or
  # typecheck failure in the PR checks.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm test

  # The Playwright suite drives a real dev server against a real Postgres.
  # deploy-lingo.yml runs this whole workflow as its gate, so a red e2e run
  # now blocks a deploy just as lint and typecheck do.
  # Whether the e2e suite, the slow part, has anything new to say. A squash
  # merge produces a commit with the same *tree* as the PR head that was just
  # tested, so the deploy's check would otherwise run three minutes of
  # browser tests against code that passed them minutes ago. Compare trees,
  # not commits, so that a merge that also picked up other changes still runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Has this tree already passed e2e?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree $tree"
          for wf in ci.yml deploy-lingo.yml; do
            for sha in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?status=success&per_page=30" \
                          -q '.workflow_runs[].head_sha'); do
              [ "$sha" = "$GITHUB_SHA" ] && continue
              t=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" -q .tree.sha 2>/dev/null) || continue
              if [ "$t" = "$tree" ]; then
                echo "same tree already passed in $wf run for $sha; skipping e2e"
                echo "e2e=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "e2e=true" >> "$GITHUB_OUTPUT"

  e2e:
    needs: gate
    if: needs.gate.outputs.e2e == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lingo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A throwaway service container, torn down with the job.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lingo_e2e
      AUTH_SECRET: e2e-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # The e2e global setup deliberately never migrates a database, so the
      # schema has to be pushed here. Safe against a container that is created
      # empty and thrown away at the end of the job.
      - name: Push the schema into the throwaway database
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The global setup seeds the vocabulary into the empty database on the
      # first run, then signs itself in with a minted session cookie.
      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
